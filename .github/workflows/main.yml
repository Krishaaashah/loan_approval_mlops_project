name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic training data
        run: python scripts/generate_synthetic_data.py --output-dir prediction_model/datasets

      - name: Rebuild model artifacts
        run: |
          python -m prediction_model.prepare_data
          python -m prediction_model.training_pipeline
          python -m prediction_model.evaluate

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q main.py prediction_model tests scripts

      - name: Build container
        run: docker build --tag mlops:ci .
