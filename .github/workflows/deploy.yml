name: Build and publish release image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional immutable tag; defaults to release-<commit>"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: loan-approval-mlops
  EC2_INSTANCE_ID: i-02fd037d73f8a7b68

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic training data
        run: python scripts/generate_synthetic_data.py --output-dir prediction_model/datasets

      - name: Rebuild model artifacts
        run: |
          python -m prediction_model.prepare_data
          python -m prediction_model.training_pipeline
          python -m prediction_model.evaluate

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="release-${GITHUB_SHA}"; fi
          if [[ ! "$IMAGE_TAG" =~ ^release-[A-Za-z0-9._-]+$ ]]; then
            echo "IMAGE_TAG must start with release- and contain only safe tag characters"
            exit 1
          fi
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image to EC2 with SSM
        env:
          IMAGE_URI: ${{ steps.build-push.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.build-push.outputs.image_tag }}
        run: |
          jq -n --arg image "$IMAGE_URI" '{
            commands: [
              "set -euo pipefail",
              "REGION=ap-south-1",
              ("IMAGE_URI=" + $image),
              "aws ecr get-login-password --region \"$REGION\" | docker login --username AWS --password-stdin 049681811107.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull \"$IMAGE_URI\"",
              "docker rm -f loan-approval-api || true",
              "docker run --detach --name loan-approval-api --restart unless-stopped --publish 80:8005 --env MLOPS_UPLOAD_PREDICTIONS=false --env MLOPS_ALLOWED_ORIGINS='*' --log-driver=awslogs --log-opt awslogs-region=ap-south-1 --log-opt awslogs-group=/mlops/loan-approval --log-opt awslogs-create-group=false --log-opt awslogs-stream=loan-api \"$IMAGE_URI\"",
              "sleep 8",
              "curl --fail --silent --show-error http://127.0.0.1/health",
              "curl --fail --silent --show-error http://127.0.0.1/ready",
              "docker inspect loan-approval-api --format '{{.Config.Image}}'"
            ]
          }' > /tmp/loan-approval-deploy-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters file:///tmp/loan-approval-deploy-commands.json \
            --query 'Command.CommandId' \
            --output text)

          STATUS="Pending"
          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "SSM deployment failed with status: $STATUS"
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment timed out with status: $STATUS"
            exit 1
          fi
