<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 72px 92px; background: #f5f9ff; color: #123b70; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 14px; font-size: 44px; }
    h2 { margin: 0 0 58px; color: #4a6380; font-size: 24px; font-weight: normal; }
    .panel { padding: 38px 44px; border: 3px solid #2271bd; border-radius: 12px; background: white; box-shadow: 0 5px 18px #bfd1e6; }
    .label { margin-bottom: 14px; color: #225b99; font-size: 23px; font-weight: bold; }
    .endpoint { margin-bottom: 34px; color: #148657; font: 28px Consolas, monospace; }
    .response { padding: 32px; border-radius: 9px; background: #102a43; color: #eaf4ff; font: 26px Consolas, monospace; }
    .note { margin-top: 42px; color: #5a6d82; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Loan Prediction API</h1>
  <h2>FastAPI prediction response</h2>
  <div class="panel">
    <div class="label">Endpoint</div>
    <div class="endpoint">POST /prediction_api</div>
    <div class="label">Response</div>
    <div class="response">{"status":"Approved"}</div>
    <div class="note">Model status: ready | Local validation request</div>
  </div>
</body>
</html>
