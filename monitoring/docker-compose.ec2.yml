services:
  prometheus:
    image: prom/prometheus:v2.53.0
    mem_limit: 160m
    cpus: 0.35
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.ec2.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - loan-approval-net

  grafana:
    image: grafana/grafana:11.1.0
    mem_limit: 220m
    cpus: 0.35
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: 43.205.216.66
      GF_SERVER_PROTOCOL: http
      GF_SERVER_ROOT_URL: http://43.205.216.66/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - loan-approval-net
    depends_on:
      - prometheus

  proxy:
    image: nginx:1.27-alpine
    mem_limit: 64m
    cpus: 0.15
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - loan-approval-net
    depends_on:
      - grafana

volumes:
  prometheus-data:
  grafana-data:

networks:
  loan-approval-net:
    external: true
